<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request – Foodwill</title>
    <link rel="stylesheet" href="styles.css">
    <!-- inline script handles fetching and rendering foods -->
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="donate.html">Donate</a></li>
                <li><a href="request.html">Request</a></li>
                <li class="right">
                    <a href="login.html" class="signup-btn" style="margin-right:10px;">Log In</a>
                    <a href="signup.html" class="signup-btn">Sign Up</a>
                </li>
            </ul>
        </nav>
        <h1>Foodwill</h1>
    </header>
    <main>
        <section class="hero">
            <div class="hero-content">
                <h2>Available Foods</h2>
                <table id="foods-table">
                    <thead>
                        <tr><th>Name</th><th>Quantity</th><th>Location</th><th>Action</th></tr>
                    </thead>
                    <tbody id="foods-list">
                        <!-- dynamic rows inserted here -->
                    </tbody>
                </table>
            </div>
        </section>

    </main>
    <footer>
        Foodwill - Connecting Communities Through Food
    </footer>

    <script>

    async function getFoods() {
      const response = await fetch("http://192.168.178.73:7000/foods");

      if (!response.ok) {
        throw new Error("Failed to fetch foods");
      }

      return response.json();
    }

    function renderFoods(foods) {
      const tbody = document.getElementById("foods-list");
      tbody.innerHTML = '';
      foods.forEach((food, index) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${food.name}</td>
          <td>${food.quantity}</td>
          <td>${food.area}</td>
          <td><button class="claim-btn" data-index="${index}">Claim</button></td>
        `;
        tbody.appendChild(tr);
      });

      // attach handlers
      tbody.querySelectorAll('.claim-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          const idx = this.getAttribute('data-index');
          claimFood(idx);
        });
      });
    }

    // remove claimed item locally and optionally send to server
    function claimFood(index) {
      // remove from DOM row
      const tbody = document.getElementById('foods-list');
      const row = tbody.querySelector(`button[data-index="${index}"]`).closest('tr');
      if (row) row.remove();
      // TODO: send claim request to backend if desired
      // example:
      // fetch('http://192.168.178.73:7000/claim', { method: 'POST', body: JSON.stringify({ index }) });
    }

    // Run immediately (script is at bottom, so DOM exists)
    getFoods()
      .then(foods => {
        console.log("Foods:", foods);
        renderFoods(foods);
      })
      .catch(err => {
        console.error("Error:", err);
      });
    </script>
</body>
</html>
