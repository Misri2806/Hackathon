<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request – Foodwill</title>
    <link rel="stylesheet" href="styles.css">
    <script src="foods.js"></script>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="donate.html">Donate</a></li>
                <li><a href="request.html">Request</a></li>
                <li class="right">
                    <a href="login.html" class="signup-btn" style="margin-right:10px;">Log In</a>
                    <a href="signup.html" class="signup-btn">Sign Up</a>
                </li>
            </ul>
        </nav>
        <h1>Foodwill</h1>
    </header>
    <main>
        <section class="hero">
            <div class="hero-content">
                <tbody id="foods-list"></tbody>
                
                <h2>Request Food</h2>
                <p>If you need food assistance, please fill out the form below to find available donations in your area.</p>
                <form style="margin-top:20px;">
                    <label>Item you want:</label>
                    <input id="item" type="text" required>

                    <label>Location:</label>
                    <select id="location" required>
                        <option value="Chicago">Chicago Area</option>
                        <option value="Houston">Houston Area</option>
                    </select>
                    
                    <button class="button" type="submit"><span>Find Match</span></button>
                </form>
                <h3 id="result"></h3>
            </div>
        </section>
        <div>
            <ul id="foods-list"></ul>
        </div>
        
    </main>
    <footer>
        Foodwill - Connecting Communities Through Food
    </footer>

    <script>
    document.querySelector('form').addEventListener('submit', async function(e) {
        e.preventDefault();
        const item = document.getElementById("item").value;
        const location = document.getElementById("location").value;

        const response = await fetch("http://localhost:8080/request", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ item, location })
        });

        const result = await response.text();
        document.getElementById("result").innerHTML = result;
    });
    async function getFoods() {
      const response = await fetch("http://192.168.178.73:7000/foods");

      if (!response.ok) {
        throw new Error("Failed to fetch foods");
      }

      return response.json();
    }

    function renderFoods(foods) {
      const tbody = document.getElementById("foods-list");

    foods.forEach(food => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${food.name}</td>
        <td>${food.quantity}</td>
        <td>${food.area}</td>
      `;
      tbody.appendChild(tr);
      });
    }

    // Run immediately (script is at bottom, so DOM exists)
    getFoods()
      .then(foods => {
        console.log("Foods:", foods);
        renderFoods(foods);
      })
      .catch(err => {
        console.error("Error:", err);
      });
    </script>
</body>
</html>
