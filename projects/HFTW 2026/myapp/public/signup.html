<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up – Foodwill</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="donate.html">Donate</a></li>
                <li><a href="request.html">Request</a></li>
                <li class="right"><a href="signup.html" class="signup-btn">Sign Up</a></li>
            </ul>
        </nav>
        <h1>Foodwill</h1>
    </header>
    <main>
        <section class="hero">
            <div class="hero-content">
                <h2>Create Your Account</h2>
                <p>Join Foodwill today and start making a difference in your community.</p>
                <form action="signup" method="post" style="margin-top:20px;">
                    <label>Username:</label>
                    <input type="text" name="username" required>

                    <label>Password:</label>
                    <input type="password" name="password" required>

                    <button class="button" type="submit"><span>Sign Up</span></button>
                </form>

                <p style="margin-top:20px;">Already have an account? <a href="login.html">Log in</a></p>
            </div>
        </section>
    </main>
    <footer>
        Foodwill - Connecting Communities Through Food
    </footer>
</body>
</html>
