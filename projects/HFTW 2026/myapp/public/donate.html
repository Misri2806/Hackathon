<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donate – Foodwill</title>
    <link rel="stylesheet" href="styles.css">
    <script src="foods.js"></script>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="donate.html">Donate</a></li>
                <li><a href="request.html">Request</a></li>
                <li id="guest-section" class="right" style="display: none;">
                    <a href="login.html" class="signup-btn" style="margin-right:10px;">Log In</a>
                    <a href="signup.html" class="signup-btn">Sign Up</a>
                </li>
            </ul>
        </nav>
        <h1>Foodwill</h1>
    </header>
    <main>
        <section class="hero">
            <div class="hero-content">
                <h2>Donate Food</h2>
                <p>Share your extra food with those in need. Fill out the form below to let us know what you'd like to donate.</p>
                <form style="margin-top:20px;">
                    <label>Item description:</label>
                    <input id="description" type="text" name="item" required>
                    
                    <label>Quantity:</label>
                    <input id="quantity" type="number" name="quantity" min="1" required>
                    
                    <label>Pickup location:</label>
                    <input id="pickup" type="text" name="location" required>
                    
                    <button onClick="addFoods()" class="button"><span>Submit</span></button>
                </form>
            </div>
        </section>
        <script>
            const params = new URLSearchParams(window.location.search);
            const username = params.get("username");

            if (username) {
        
                document.getElementById("user-section").style.display = "block";
                document.getElementById("username").textContent = username;
            
                //document.getElementById("guest-section").style.display = "none";
            } else {
                document.getElementById("guest-section").style.display = "block";
            }
        </script>
    </main>
    <footer>
        Foodwill - Connecting Communities Through Food
    </footer>
</body>
</html>
