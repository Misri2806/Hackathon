<!DOCTYPE html>
<html>
<head>
  <title>FoodShare - Sustainability App</title>
  <style>
    body {
      font-family: Arial;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    .tabs {
      display: flex;
      background-color: #2e7d32;
    }

    .tabs button {
      flex: 1;
      padding: 15px;
      border: none;
      background-color: #2e7d32;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .tabs button:hover {
      background-color: #1b5e20;
    }

    .section {
      display: none;
      padding: 20px;
    }

    input {
      padding: 8px;
      margin: 5px;
    }

    button.action {
      padding: 8px 12px;
      margin-top: 10px;
      background-color: #4caf50;
      border: none;
      color: white;
      cursor: pointer;
    }

    .card {
      border: 1px solid gray;
      margin: 10px;
      padding: 10px;
    }
  </style>
</head>

<body>

  <div class="tabs">
    <button onclick="showSection('home')">Home</button>
    <button onclick="showSection('donate')">Donate</button>
    <button onclick="showSection('request')">Request</button>
  </div>

  <!-- HOME -->
  <div id="home" class="section">
    <h2>Welcome to FoodShare 🌱</h2>
    <p>Reducing food waste. Connecting people.</p>
  </div>

  <!-- DONATE -->
  <div id="donate" class="section">
    <h2>Donate Food</h2>
    <input type="text" id="foodName" placeholder="Food Item">
    <input type="text" id="quantity" placeholder="Quantity">
    <br>
    <button class="action" onclick="addDonation()">Submit Donation</button>
  </div>

  <!-- REQUEST -->
  <div id="request" class="section">
    <h2>Available Food</h2>
    <div id="foodList"></div>
  </div>

  <script>
    let donations = [];

    function showSection(sectionId) {
      let sections = document.getElementsByClassName("section");
      for (let i = 0; i < sections.length; i++) {
        sections[i].style.display = "none";
      }
      document.getElementById(sectionId).style.display = "block";
    }

    function addDonation() {
      let name = document.getElementById("foodName").value;
      let qty = document.getElementById("quantity").value;

      if (name === "" || qty === "") {
        alert("Please fill all fields");
        return;
      }

      donations.push({ name: name, quantity: qty });
      document.getElementById("foodName").value = "";
      document.getElementById("quantity").value = "";
      alert("Donation added!");
      displayDonations();
    }

    function displayDonations() {
      let list = document.getElementById("foodList");
      list.innerHTML = "";

      for (let i = 0; i < donations.length; i++) {
        list.innerHTML += `
          <div class="card">
            <p><strong>${donations[i].name}</strong></p>
            <p>Quantity: ${donations[i].quantity}</p>
            <button class="action" onclick="claimFood(${i})">Claim</button>
          </div>
        `;
      }
    }

    function claimFood(index) {
      donations.splice(index, 1);
      displayDonations();
      alert("Food claimed successfully!");
    }

    // Show home by default
    showSection('home');
  </script>

</body>
</html>
